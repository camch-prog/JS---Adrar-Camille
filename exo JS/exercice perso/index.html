<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css.css">
</head>
<body>
<!-- EXERCICE 1 -->
    <h1>Ma liste</h1>

    <p>Bonjour</p>
    <p>Salut</p>
    <p>Bonsoir</p>

    <script>
            let paragraphs = document.getElementsByTagName("p");
            let paragraphsArray = Array.from(paragraphs);
            paragraphsArray.map((x)=> x.innerHTML ="🔥 " + x.innerHTML);
    </script>
<!-- EXERCICE 2 -->
    <p>skate</p>
    <p>surf</p>
    <p>snow</p>

    <script>
            let paragraphsDeux = document.getElementsByTagName("p")
            let ArrayDeux = Array.from(paragraphsDeux);
            ArrayDeux.map((x)=>x.innerHTML = x.innerHTML.toUpperCase())
    </script>

<!-- EXERCICE 3 -->
    <p>Paris</p>

    <script>
        let pTrois = document.getElementsByTagName("p");

<!-- EXERCICE 5 -->
    <button>Changer</button>
    <p>Hello</p>
    <script>
        let bouton = document.getElementsByTagName("button")[0];
        bouton.addEventListener('click', () => {
            let paragraph = document.getElementsByTagName("p")[12];
            paragraph.innerHTML = "clicked!"
        })
    </script>
<!-- EXERCICE 6 -->
    <p>Item</p>
    <p>Item</p>
    <p>Item</p>
    <p>Item</p>
    <script>
        let paragraphSix = document.getElementsByTagName("p");
        let arraySix = Array.from(paragraphSix);
        arraySix.map((x, y)=>{
            if(y % 2===0){
                x.classList.add("red")
            }
            else{
                x.classList.add('blue')
            }
        })
    </script>
